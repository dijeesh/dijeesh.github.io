<footer class="footer">
  <div class="container">
    <div class="footer-inner">
      <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
      <p class="footer-built">Built with <a href="https://kiro.dev/" target="_blank"><img src="/images/kiro.webp" alt="Kiro" class="kiro-icon"> Kiro</a></p>
      <div class="footer-social">
        {{ with .Site.Params.social.linkedin }}<a href="{{ . }}" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>{{ end }}
        {{ with .Site.Params.social.github }}<a href="{{ . }}" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>{{ end }}
        {{ with .Site.Params.social.twitter }}<a href="{{ . }}" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>{{ end }}
      </div>
    </div>
  </div>
</footer>
