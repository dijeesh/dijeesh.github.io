{{ define "main" }}
<section class="section page-header">
  <div class="container">
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</section>
<section class="section">
  <div class="container">
    {{ range .Pages }}
    <article>
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p>{{ .Summary }}</p>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
