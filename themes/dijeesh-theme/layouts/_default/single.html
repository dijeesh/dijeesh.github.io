{{ define "main" }}
<article class="article">
  <div class="container container-narrow">
    <header class="article-header">
      <h1 class="article-title">{{ .Title }}</h1>
      <time class="article-date">{{ .Date.Format "January 2, 2006" }}</time>
    </header>
    <div class="article-content">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
